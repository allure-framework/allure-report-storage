name: Publish Docker image

on:
  workflow_call:
    inputs:
      release_tag:
        description: Docker tag to publish
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Docker tag to publish
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/allure-report-storage
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
