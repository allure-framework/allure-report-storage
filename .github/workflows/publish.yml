name: Publish Docker image

on:
  workflow_call:
    inputs:
      release_tag:
        description: Docker tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Docker tag to publish
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      IMAGE_NAME: allure/allure-report-storage
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
      - uses: docker/oidc-action@v1
        id: docker-oidc
        with:
          connection_id: 60874ab1-3dcc-4ecb-b4ad-d96f4595637e
      - uses: docker/login-action@v3
        with:
          username: allure
          password: ${{ steps.docker-oidc.outputs.token }}
      - run: docker push ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
