name: Publish Docker image

on:
  workflow_call:
    inputs:
      release_tag:
        description: Docker tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Docker tag to publish
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      IMAGE_NAME: allure/allure-report-storage
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
      - uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}
      - run: docker push ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
