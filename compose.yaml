services:
  app:
    image: allure/allure-report-storage:v1.0.0
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:-change-me}
      DATABASE_PATH: /data/reports.sqlite
      DATA_DIR: /data
      HOST: 0.0.0.0
      MAIN_BRANCH: ${MAIN_BRANCH:-main}
      PORT: 3000
      # Optional report retention. Uncomment and set positive values to enable.
      # REPORT_RETENTION_MAX_REPORTS_PER_BRANCH: 20
      # REPORT_RETENTION_MAX_REPORT_AGE_DAYS: 1
      SECRET: ${SECRET:-change-me-secret}
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - report-data:/data

volumes:
  report-data:
