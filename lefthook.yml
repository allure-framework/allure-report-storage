pre-commit:
  parallel: false
  jobs:
    - name: Lint code
      glob:
        - "src/**/*.js"
        - "src/**/*.ts"
        - "src/**/*.tsx"
      run: "yarn oxlint --fix {staged_files}"
      stage_fixed: true
      exclude:
        - "dist/**/*"
        - "out/**/*"
        - "allure-report/**/*"
        - "node_modules/**/*"
    - name: Format code
      glob:
        - "src/**/*.js"
        - "src/**/*.ts"
        - "src/**/*.tsx"
      exclude:
        - "dist/**/*"
        - "out/**/*"
        - "allure-report/**/*"
        - "node_modules/**/*"
      run: "yarn oxfmt --write {staged_files}"
      stage_fixed: true
    - name: Format package.json(s)
      glob: "package.json"
      run: "yarn oxfmt --write {staged_files}"
      stage_fixed: true
